<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>status-api — Status</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --green: #3fb950;
            --red: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container { width: 100%; max-width: 640px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 24px; }
        .banner {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            margin-bottom: 20px;
        }
        .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 8px;
            box-shadow: 0 0 0 4px rgba(63,185,80,0.15);
        }
        .dot.off { background: var(--red); box-shadow: 0 0 0 4px rgba(248,81,73,0.15); }
        .banner h2 { font-size: 1.75rem; font-weight: 600; color: var(--green); margin-bottom: 8px; }
        .banner h2.off, .service-status.off { color: var(--red); }
        .banner p { color: var(--muted); font-size: 0.9rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .card h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .service {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }
        .service + .service { border-top: 1px solid var(--border); }
        .service-name { font-weight: 500; }
        .service-status { color: var(--green); font-size: 0.9rem; }
        footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>status-api</h1>
        <div class="banner">
            <h2><span class="dot"></span>All systems operational</h2>
            <p>Everything is running smoothly.</p>
        </div>
        <div class="card">
            <h3>Services</h3>
            <div class="service">
                <span class="service-name">API</span>
                <span class="service-status" id="service-status">ok</span>
            </div>
        </div>
        <footer>Last updated: <span id="updated"></span></footer>
    </div>
    <script>
        document.getElementById("updated").textContent = new Date().toUTCString();
        fetch("status.json")
            .then((response) => response.json())
            .then((data) => {
                const ok = data.status === "ok";
                const statusEl = document.getElementById("service-status");
                statusEl.textContent = data.status;
                statusEl.classList.toggle("off", !ok);
                const banner = document.querySelector(".banner h2");
                banner.innerHTML = ok
                    ? '<span class="dot"></span>All systems operational'
                    : '<span class="dot off"></span>Service inactive';
                banner.classList.toggle("off", !ok);
                document.querySelector(".banner p").textContent = ok
                    ? "Everything is running smoothly."
                    : "The API is currently inactive.";
            })
            .catch(() => {});
    </script>
</body>
</html>
